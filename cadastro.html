<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <script defer src="cadastro.js"></script>
    <title>Área de Cadastro</title>
</head>
<body>

    <main>
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form action="#" id="form-cadastro">
               
                <label for="nome"> Nome </label>
                <input type="text" id="nome" placeholder="Informe seu nome" required>

                <label for="email"> Email</label>
                <input type="email" id="email" placeholder="Informe seu email" required>

                 <label for="usuario"> Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuario" required>
                
                
                <div class="area-senha">

                    <div>
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" placeholder="Informe sua senha" required>
                    </div>

                    <div>
                        <label for="confirma-senha"> Confirma Senha </label>
                        <input type="password" id="confirma-senha" placeholder="Confirme sua senha" required>
                    </div>
                </div>
                
                <label id="msg-erro"></label>

                <button  id="btn-cadastrar" type="submit"> Cadastrar-se </button>
                <a href="login.html" id="link-nao-conta"> Já possuo uma conta. Acessar agora!</a>

            </form>

        </section>

        
        <section class="sessao-imagem">
            <img src="img/tela-login.png" alt="Casal numa livraria">
        </section>

    </main>

</body>
</html>
