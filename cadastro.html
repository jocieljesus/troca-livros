<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js" defer></script>
    <title>Area de Cadastro</title>
</head>
<body>

       <main id="tela-cadastro">
        <section class="sessao-login">
            <div class="area-titulo titulo-cadastro">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form action="#" id="form-cadastro">

                <label for="nome"> Nome </label>
                <input type="text" id="nome" placeholder="Informe seu nome" required>

                <label for="email"> Email</label>
                <input type="email" id="email" placeholder="Informe seu email" required>

                <label for="usuario"> Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuario" required>
                
                 <div class="area-senha">
                    <div class="campo-senha">
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" placeholder="Informe uma senha" required>
                    </div>
                    <div class="campo-senha">
                        <label for="confirma-senha"> Confirma senha </label>
                        <input type="password" id="confirma-senha" placeholder="Confirme a senha" required>
                    </div>
                 </div>

                <label id="msg-erro"></label>
                <button id="btn-cadastrar" type="submit"> Cadastrar-se </button>
                <a href="" id="link-ja-conta">  Já possuo uma conta. Acessar agora! </a>
        </section>
        <section class="sessao-imagem img-cadastro">
            <img src="img/tela-login.png" alt="Casal numa livraria" id="img-cadastro">
        </section>

    </main>
    
</body>
</html>
