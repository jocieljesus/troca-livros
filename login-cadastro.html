<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="cadastro.css">
    <title>Área de Usuario</title>
</head>
<body>

    <main id="tela-login">
        <section class="sessao-imagem img-cadastro">
            <img src="img/tela-login.png" alt="Casal numa livraria" id="img-login">
        </section>

        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>
            <form action="#" id="form-login">

                <label for="email-login"> Usuário ou Email</label>
                <input type="text" id="email-login" placeholder="Informe seu email">
                
                <label for="senha-login"> Senha </label>
                <input type="password" id="senha-login" placeholder="Informe sua senha">

                <div class="links-senha"> 
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>
                    
                    <a href="index.html" id="link-esqueceu-senha"> Esqueceu a senha? </a>
                </div>

                <button id="btn-acessar"> Acessar </button>
                <p id="msg-login" class="msg"></p>
                <a  href=""  id="link-nao-conta" class="link"> Ainda não possuo uma conta </a>

            </form>

        </section>
    </main>

    <main id="tela-cadastro" class="escondido">
        <section class="sessao-login">
            <div class="area-titulo titulo-cadastro">
                <h1>Connect<span>Book</span></h1>
                <h2>Troque livros, multiplique histórias</h2>
            </div>

            <form action="#" id="form-cadastro">

                <label for="nome"> Nome </label>
                <input type="text" id="nome" placeholder="Informe seu nome">

                <label for="email"> Email</label>
                <input type="email" id="email" placeholder="Informe seu email">

                <label for="usuario"> Usuário</label>
                <input type="text" id="usuario" placeholder="Informe seu usuario">
                
                 <div class="area-senha">
                    <div class="campo-senha">
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" placeholder="Informe uma senha">
                    </div>
                    <div class="campo-senha">
                        <label for="confirma-senha"> Confirma senha </label>
                        <input type="password" id="confirma-senha" placeholder="Confirme a senha">
                    </div>
                 </div>


                <button id="btn-cadastrar"> Cadastrar-se </button>
                <p id="msg-cadastro" class="msg"></p>
                <a href="" id="link-ja-conta">  Já possuo uma conta. Acessar agora! </a>
        </section>
        <section class="sessao-imagem img-cadastro">
            <img src="img/tela-login.png" alt="Casal numa livraria" id="img-cadastro">
        </section>

    </main>

    <script src="login-cadastro.js"></script>
</body>
</html>
